name: Release

# Tag-triggered release: push a vX.Y.Z tag and this builds, verifies, and
# publishes a GitHub release. Notes come from the matching CHANGELOG.md section
# (falling back to the git log when no section exists).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify built binary is in sync with src/
        run: |
          make build
          if ! git diff --quiet dotcontext; then
            echo "::error::dotcontext is out of sync with src/. Run 'make build' and commit before tagging."
            git diff --stat dotcontext
            exit 1
          fi

      - name: Verify tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -E '^VERSION=' dotcontext | cut -d'"' -f2)"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION=${ver} in the binary."
            exit 1
          fi

      - name: Generate release notes
        run: |
          ver="${GITHUB_REF_NAME#v}"
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")"

          # Prefer the curated CHANGELOG.md section for this version (everything
          # between its "## [ver]" header and the next "## [" header).
          notes="$(awk -v ver="$ver" '
            index($0, "## [" ver "]") == 1 { capture=1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md)"

          {
            if [ -n "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
              printf '%s\n' "$notes"
            else
              # Fallback: build from the git log since the previous tag.
              echo "## What's Changed"
              echo ""
              if [ -n "$prev" ]; then
                git log --no-merges --pretty='* %s (%h)' "${prev}..${GITHUB_REF_NAME}"
              else
                git log --no-merges --pretty='* %s (%h)' "${GITHUB_REF_NAME}"
              fi
            fi
            if [ -n "$prev" ]; then
              echo ""
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — skipping."
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
